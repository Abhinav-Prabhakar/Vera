<style>

  :root{
    --bg: #050a0c;
    --glass: rgba(6, 18, 22, 0.58);
    --glass-deep: rgba(4, 12, 15, 0.76);
    --line: rgba(120, 255, 210, 0.135);
    --line-strong: rgba(120, 255, 210, 0.28);
    --accent: #57ffc0;
    --accent-soft: rgba(87, 255, 192, 0.10);
    --dim: #66847f;
    --mid: #8fb9af;
    --text: #d7ede7;
    --warm: #ffcf97;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:var(--bg); }
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  /* =========================================================
     INTERFACE — floating, frameless; legibility comes from soft
     edge scrims and type, not from boxes
     ========================================================= */
  :root{
    --sans: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ink: #eefff9;
    --soft: rgba(222, 244, 237, .72);
    --mute: rgba(190, 225, 214, .46);
    --faint: rgba(190, 225, 214, .16);
    --glass: rgba(5, 15, 18, .64);
    --amber: #ffb35c;
    --red: #ff6b6b;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  #hud{
    position:fixed; inset:0; pointer-events:none; z-index:10;
    color:var(--soft); font-family:var(--sans); font-size:12px;
    opacity:0; transition:opacity 1.2s ease .15s;
    text-shadow:0 1px 12px rgba(0,0,0,.35);
  }
  body.ready #hud{ opacity:1; }
  :where(#hud) button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-appearance:none; appearance:none; }
  #hud button:focus-visible, #bell:focus-visible{ outline:1px solid var(--accent); outline-offset:3px; border-radius:8px; }
  .i{ width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; display:block; }
  .num{ font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .cap{ font-family:var(--mono); font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--mute); }

  .scrim{ position:absolute; pointer-events:none; }
  .scrim-l{ left:0; top:0; bottom:0; width:520px; background:linear-gradient(90deg, rgba(2,8,10,.66), rgba(2,8,10,.28) 45%, transparent); }
  .scrim-r{ right:0; top:0; bottom:0; width:560px; background:linear-gradient(270deg, rgba(2,8,10,.66), rgba(2,8,10,.24) 45%, transparent); }
  .scrim-b{ left:0; right:0; bottom:0; height:300px; background:linear-gradient(0deg, rgba(2,8,10,.55), transparent); }

  /* ---------- head ---------- */
  #head{ position:absolute; left:30px; top:26px; pointer-events:auto; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:22px; height:22px; color:var(--accent); filter:drop-shadow(0 0 10px rgba(87,255,192,.35)); }
  .wm{ font-size:12px; font-weight:700; letter-spacing:.42em; color:var(--ink); }
  .wm i{ color:var(--accent); font-style:normal; }
  .live{ width:14px; height:14px; display:grid; place-items:center; pointer-events:auto; }
  .live i{ width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); animation:breathe 2s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.35; transform:scale(.7); } }

  #crumbs{ display:flex; align-items:center; gap:4px; margin-top:26px; min-height:16px; }
  #crumbs button{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); padding:2px 3px; transition:color .2s; animation:rise .45s var(--ease) backwards; }
  #crumbs button:hover{ color:var(--ink); }
  #crumbs button.cur{ color:var(--accent); cursor:default; }
  #crumbs .sep{ width:10px; height:10px; color:var(--faint); animation:rise .45s var(--ease) backwards; }
  #crumbs.quiet *, #meta.quiet *{ animation:none !important; }
  #title{ margin-top:6px; font-size:36px; line-height:1.05; font-weight:250; letter-spacing:-.02em; color:var(--ink); animation:rise .6s var(--ease); }
  #meta{ display:flex; align-items:center; gap:20px; margin-top:12px; min-height:26px; }
  .m-item{ display:flex; align-items:center; gap:7px; color:var(--soft); animation:rise .55s var(--ease) backwards; }
  .m-item .i{ width:15px; height:15px; color:var(--mute); }
  .m-item b{ font-family:var(--mono); font-weight:500; font-size:13px; color:var(--ink); font-variant-numeric:tabular-nums; }
  .m-item em{ font-style:normal; font-family:var(--mono); font-size:10px; color:var(--mute); }
  .m-item.warn .i, .m-item.warn b{ color:var(--amber); }
  button.m-item:hover b{ text-decoration:underline; text-underline-offset:3px; }
  .ring{ width:26px; height:26px; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:3; }
  .ring .t{ stroke:var(--faint); }
  .ring .a{ stroke-linecap:round; transition:stroke-dashoffset 1s var(--ease), stroke .4s; }
  .swatches{ display:flex; }
  .swatches i{ width:12px; height:12px; border-radius:50%; box-shadow:0 0 0 2px rgba(3,10,12,.9); }
  .swatches i + i{ margin-left:-4px; }
  #overrides{ display:flex; align-items:center; gap:8px; margin-top:16px; padding:6px 12px 6px 9px; border-radius:20px; background:rgba(255,179,92,.10); color:var(--amber); font-size:11px; animation:rise .45s var(--ease); }
  #overrides .i{ width:15px; height:15px; }
  #overrides u{ text-decoration:none; color:rgba(255,214,170,.65); margin-left:4px; transition:color .2s; }
  #overrides:hover u{ color:#ffe3c4; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  /* ---------- dock ---------- */
  #hud [hidden]{ display:none !important; }
  #dock{ position:absolute; left:28px; top:236px; display:flex; flex-direction:column; gap:8px; pointer-events:auto; }
  #dock .gap{ height:8px; }
  #dock .cap{ margin:0 0 4px 2px; animation:rise .4s var(--ease); }
  .ctl{ position:relative; width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
    background:rgba(8,22,26,.5); backdrop-filter:blur(10px) saturate(1.3); -webkit-backdrop-filter:blur(10px) saturate(1.3);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 6px 20px rgba(0,0,0,.25);
    transition:transform .25s var(--ease), box-shadow .3s; animation:pop .5s var(--ease) backwards; }
  .ctl:hover{ transform:scale(1.07); }
  .ctl:active{ transform:scale(.95); }
  .ctl > .i{ width:18px; height:18px; color:var(--soft); transition:color .3s, opacity .3s; }
  .ctl svg.arc{ position:absolute; inset:0; width:42px; height:42px; transform:rotate(-90deg); pointer-events:none; }
  .ctl svg.arc circle{ fill:none; stroke-width:2; }
  .ctl svg.arc .t{ stroke:rgba(255,255,255,.06); }
  .ctl svg.arc .a{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .8s var(--ease), stroke .3s; filter:drop-shadow(0 0 3px rgba(87,255,192,.6)); }
  .ctl .md{ position:absolute; right:-1px; bottom:-1px; width:15px; height:15px; border-radius:50%; display:grid; place-items:center; background:#0a1a1d; color:var(--amber); transform:scale(0); transition:transform .3s var(--ease); }
  .ctl .md .i{ width:10px; height:10px; }
  .ctl.manual .md{ transform:scale(1); }
  .ctl.manual svg.arc .a{ stroke:var(--amber); filter:drop-shadow(0 0 3px rgba(255,179,92,.6)); }
  .ctl.off > .i{ opacity:.35; }
  .ctl.off svg.arc .a{ stroke:transparent; filter:none; }
  .ctl.open{ box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(87,255,192,.5), 0 0 22px rgba(87,255,192,.25); }
  .ctl.toggled > .i{ color:var(--accent); }
  .ctl.toggled{ box-shadow:inset 0 0 0 1px rgba(87,255,192,.45), 0 0 18px rgba(87,255,192,.18); }
  .ctl.flash svg.arc .a{ animation:flash .9s ease; }
  @keyframes flash{ 30%{ stroke:#fff; stroke-width:4; } }
  .ctl .lbl{ position:absolute; left:54px; top:50%; white-space:nowrap; pointer-events:none;
    display:flex; align-items:baseline; gap:8px; opacity:0; transform:translate(-6px, -50%); transition:opacity .2s, transform .25s var(--ease); }
  .ctl .lbl b{ font-weight:500; font-size:12px; color:var(--ink); }
  .ctl .lbl em{ font-style:normal; font-family:var(--mono); font-size:10px; color:var(--mute); }
  .ctl:hover .lbl, .ctl.hv .lbl{ opacity:1; transform:translate(0, -50%); }
  .ctl.open .lbl{ opacity:0; }
  @keyframes pop{ from{ opacity:0; transform:scale(.6); } }

  /* ---------- popover ---------- */
  #pop{ position:absolute; z-index:20; left:86px; width:288px; padding:18px 18px 16px; border-radius:18px; pointer-events:auto;
    background:var(--glass); backdrop-filter:blur(22px) saturate(1.4); -webkit-backdrop-filter:blur(22px) saturate(1.4);
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
    transform-origin:0 30px; animation:popIn .35s var(--ease); text-shadow:none; }
  @keyframes popIn{ from{ opacity:0; transform:translateX(-8px) scale(.97); } }
  .p-head{ display:flex; align-items:center; gap:10px; }
  .p-head .i{ width:18px; height:18px; color:var(--accent); }
  .p-head b{ font-weight:500; font-size:13px; color:var(--ink); white-space:nowrap; }
  .p-head .cap{ font-size:8.5px; margin-left:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .p-head .sp{ flex:1; }
  .sw{ position:relative; width:34px; height:20px; border-radius:20px; background:rgba(255,255,255,.1); transition:background .3s; }
  .sw::after{ content:""; position:absolute; left:3px; top:3px; width:14px; height:14px; border-radius:50%; background:#cfe6df; transition:transform .3s var(--ease), background .3s; }
  .sw.on{ background:rgba(87,255,192,.35); }
  .sw.on::after{ transform:translateX(14px); background:#fff; box-shadow:0 0 10px rgba(87,255,192,.8); }
  .p-x{ width:26px; height:26px; display:grid; place-items:center; border-radius:50%; color:var(--mute); margin-right:-6px; }
  .p-x:hover{ color:var(--ink); background:rgba(255,255,255,.06); }
  .p-x .i{ width:14px; height:14px; color:inherit; }
  .p-big{ display:flex; align-items:baseline; gap:6px; margin-top:16px; }
  .p-big b{ font-family:var(--mono); font-weight:300; font-size:44px; letter-spacing:-.04em; color:var(--ink); line-height:1; font-variant-numeric:tabular-nums; }
  .p-big em{ font-style:normal; font-size:13px; color:var(--mute); }
  .p-big .now{ margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; color:var(--mute); }
  .p-big .now b{ font-size:13px; font-weight:500; color:var(--soft); letter-spacing:0; }
  .p-big .now .i{ width:14px; height:14px; }

  .slider{ position:relative; height:28px; margin-top:12px; cursor:pointer; touch-action:none; }
  .slider .trk{ position:absolute; left:0; right:0; top:12px; height:4px; border-radius:4px; background:rgba(255,255,255,.08); }
  .slider .fill{ position:absolute; left:0; top:12px; height:4px; border-radius:4px; background:linear-gradient(90deg, rgba(87,255,192,.35), var(--accent)); box-shadow:0 0 12px rgba(87,255,192,.4); }
  .slider .th{ position:absolute; top:6px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(87,255,192,.18), 0 2px 8px rgba(0,0,0,.4); transition:box-shadow .2s; }
  .slider:hover .th, .slider.drag .th{ box-shadow:0 0 0 7px rgba(87,255,192,.2), 0 2px 8px rgba(0,0,0,.4); }
  .slider.amber .fill{ background:linear-gradient(90deg, rgba(255,179,92,.35), var(--amber)); box-shadow:0 0 12px rgba(255,179,92,.4); }
  .slider.amber .th{ box-shadow:0 0 0 4px rgba(255,179,92,.2), 0 2px 8px rgba(0,0,0,.4); }
  .slider .tk{ position:absolute; top:20px; width:1px; height:4px; background:var(--faint); }

  .seg2{ position:relative; display:grid; grid-template-columns:1fr 1fr; margin-top:14px; padding:3px; border-radius:12px; background:rgba(255,255,255,.05); }
  .seg2 button{ position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:7px; height:32px; font-size:11.5px; color:var(--mute); transition:color .25s; }
  .seg2 button .i{ width:14px; height:14px; }
  .seg2 button.on{ color:var(--ink); }
  .seg2 .pill{ position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); border-radius:9px; background:rgba(87,255,192,.14); box-shadow:inset 0 0 0 1px rgba(87,255,192,.25); transition:transform .35s var(--ease), background .3s, box-shadow .3s; }
  .seg2.man .pill{ transform:translateX(100%); background:rgba(255,179,92,.14); box-shadow:inset 0 0 0 1px rgba(255,179,92,.3); }
  .p-note{ margin-top:10px; font-size:11px; line-height:1.45; color:var(--mute); min-height:16px; }
  .p-note b{ color:var(--soft); font-weight:500; }

  .sched{ display:flex; align-items:flex-end; gap:1.5px; height:38px; margin-top:16px; position:relative; }
  .sched i{ flex:1; border-radius:1.5px 1.5px 0 0; background:linear-gradient(0deg, rgba(255,120,190,.25), rgba(255,150,205,.75)); min-height:2px; transition:height .5s var(--ease); }
  .sched i.past{ opacity:.45; }
  .sched .nowm{ position:absolute; top:-4px; bottom:-3px; width:1px; background:var(--ink); box-shadow:0 0 8px #fff; }
  .s-axis{ display:flex; justify-content:space-between; margin-top:5px; font-family:var(--mono); font-size:8.5px; color:var(--mute); }

  .flow{ position:relative; height:36px; margin-top:16px; overflow:hidden; border-radius:8px; }
  .flow i{ position:absolute; left:0; right:0; height:2px; border-radius:2px;
    background:repeating-linear-gradient(90deg, rgba(87,255,192,.65) 0 14px, transparent 14px 30px);
    background-size:30px 2px; animation:flowx var(--dur, 1.2s) linear infinite; opacity:var(--op, 1); }
  .flow i:nth-child(1){ top:8px; } .flow i:nth-child(2){ top:17px; animation-delay:-.4s; } .flow i:nth-child(3){ top:26px; animation-delay:-.8s; }
  .flow.bub i{ background:radial-gradient(circle, rgba(140,230,255,.8) 0 2px, transparent 2.5px); background-size:22px 8px; height:8px; animation-name:flowy; }
  .flow.bub i:nth-child(1){ top:2px; } .flow.bub i:nth-child(2){ top:14px; } .flow.bub i:nth-child(3){ top:26px; }
  @keyframes flowx{ to{ background-position:30px 0; } }
  @keyframes flowy{ to{ background-position:22px -8px; } }

  .stepper{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
  .stepper button{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.06); transition:background .2s, transform .15s; }
  .stepper button:hover{ background:rgba(87,255,192,.14); }
  .stepper button:active{ transform:scale(.92); }
  .stepper button .i{ width:14px; height:14px; }
  .stepper .sv{ text-align:center; }
  .stepper .sv b{ font-family:var(--mono); font-weight:400; font-size:24px; color:var(--ink); letter-spacing:-.03em; }
  .stepper .sv em{ display:block; font-style:normal; font-size:10px; color:var(--mute); margin-top:2px; }
  .chips{ display:flex; gap:6px; margin-top:14px; align-items:center; }
  .chips button{ white-space:nowrap; height:30px; padding:0 12px; border-radius:15px; font-family:var(--mono); font-size:11px; color:var(--mute); background:rgba(255,255,255,.05); transition:all .2s; }
  .chips button.on{ color:var(--ink); background:rgba(87,255,192,.14); box-shadow:inset 0 0 0 1px rgba(87,255,192,.3); }
  .chips .go{ margin-left:auto; padding:0 16px 0 12px; display:flex; align-items:center; gap:7px; color:#04140f; background:var(--accent); font-family:var(--sans); font-weight:600; box-shadow:0 0 18px rgba(87,255,192,.35); }
  .chips .go .i{ width:14px; height:14px; stroke-width:2; }
  .chips .go:active{ transform:scale(.95); }
  .tl{ position:relative; height:22px; margin-top:16px; }
  .tl::before{ content:""; position:absolute; left:0; right:0; top:10px; height:1px; background:var(--faint); }
  .tl i{ position:absolute; top:7px; width:7px; height:7px; margin-left:-3.5px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .tl i.next{ background:none; box-shadow:inset 0 0 0 1.5px var(--accent); }
  .tl i.man{ background:var(--amber); box-shadow:0 0 8px var(--amber); }
  .tl span{ position:absolute; top:-2px; font-family:var(--mono); font-size:8.5px; color:var(--mute); }

  /* ---------- top right ---------- */
  #tr{ position:absolute; right:30px; top:24px; display:flex; align-items:center; gap:22px; pointer-events:auto; }
  .clock{ display:flex; align-items:center; gap:10px; }
  #dayRing{ width:34px; height:34px; }
  .clock span{ display:flex; flex-direction:column; line-height:1.05; }
  .clock b{ font-family:var(--mono); font-weight:400; font-size:17px; color:var(--ink); letter-spacing:-.02em; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Lensflare, LensflareElement } from 'three/addons/objects/Lensflare.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';

const QUERY = new URLSearchParams(location.search);

/* =========================================================================
   00a — ATMOSPHERIC FOG
   Fog tinted by the sun (forward scattering) and thicker near the ground.
   Patched into the shared chunks so every built-in material picks it up.
   ========================================================================= */
const SUN_DIR = (QUERY.get('sun')
  ? new THREE.Vector3(...QUERY.get('sun').split(',').map(Number))
  : new THREE.Vector3(0.78, 0.33, -0.53)).normalize();
const UP = new THREE.Vector3(0, 1, 0);
{
  const sd = `vec3(${SUN_DIR.x.toFixed(5)}, ${SUN_DIR.y.toFixed(5)}, ${SUN_DIR.z.toFixed(5)})`;
  THREE.ShaderChunk.fog_pars_vertex = `
#ifdef USE_FOG
  varying float vFogDepth;
  varying vec3 vFogDir;
#endif`;
  THREE.ShaderChunk.fog_vertex = `
#ifdef USE_FOG
  vFogDepth = - mvPosition.z;
  vFogDir = ( vec4( mvPosition.xyz, 0.0 ) * viewMatrix ).xyz;
#endif`;
  THREE.ShaderChunk.fog_pars_fragment = `
#ifdef USE_FOG
  uniform vec3 fogColor;
  varying float vFogDepth;
  varying vec3 vFogDir;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear;
    uniform float fogFar;
  #endif
#endif`;
  THREE.ShaderChunk.fog_fragment = `
#ifdef USE_FOG
  vec3 fDir = normalize( vFogDir );
  float fSun = max( dot( fDir, ${sd} ), 0.0 );
  float fHeight = max( cameraPosition.y + vFogDir.y, 0.0 );
  #ifdef FOG_EXP2
    float fD = fogDensity * vFogDepth;
    float fogFactor = 1.0 - exp( - fD * fD );
    fogFactor *= 0.62 + 0.62 * exp( - fHeight * 0.045 );
  #else
    float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
  #endif
  vec3 fCol = fogColor * mix( vec3( 0.86, 0.95, 1.06 ), vec3( 1.0 ), smoothstep( -0.4, 0.6, fSun ) );
  fCol = mix( fCol, fogColor * vec3( 1.55, 1.18, 0.82 ), pow( fSun, 5.0 ) * 0.62 );
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fCol, clamp( fogFactor, 0.0, 1.0 ) );
#endif`;
}

/* =========================================================================
   00 — CORE
   ========================================================================= */
if (!document.createElement('canvas').getContext('webgl2')){
  document.querySelector('.loader-sub').textContent = 'THIS BROWSER HAS NO WEBGL 2 — TRY CHROME, EDGE, FIREFOX OR SAFARI 15+';
  document.querySelector('.loader-bar').style.display = 'none';
  throw new Error('Vera needs WebGL 2');
}
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: 'high-performance',
  stencil: false,
  alpha: false
});
const PIXEL_RATIO = Math.min(window.devicePixelRatio || 1, 1.6);
let CURRENT_PR = PIXEL_RATIO;
renderer.setPixelRatio(PIXEL_RATIO);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// nothing that casts a shadow moves, so the 4K shadow map is drawn once
// (and again only when something asks for it) instead of every frame
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
renderer.toneMapping = QUERY.get('tm') === 'agx' ? THREE.AgXToneMapping : THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbcc6c0, 0.0026);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 16000);
camera.position.set(29.5, 9.8, 27.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;
controls.panSpeed = 0.6;
controls.minDistance = 3.2;
controls.maxDistance = 105;
controls.minPolarAngle = 0.06;
controls.maxPolarAngle = Math.PI * 0.492;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.20;
controls.enablePan = true;


/* =========================================================================
   01 — UTILITIES + SEEDED RANDOM
   ========================================================================= */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0x71A9E07);
const rnd = (a, b) => a + (b - a) * rand();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(a, b, x){
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

function canvasTexture(canvas, opts = {}){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
  if (opts.offset) t.offset.set(opts.offset[0], opts.offset[1]);
  t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = Math.min(opts.aniso || 8, MAX_ANISO);
  t.needsUpdate = true;
  return t;
}

/* ---- value noise (used by textures + terrain) ---- */
function hash2(x, y){
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct = 5){
  let v = 0, amp = 0.5, fx = x, fy = y;
  for (let i = 0; i < oct; i++){
    v += vnoise(fx, fy) * amp;
    fx = fx * 2.03 + 17.1;
    fy = fy * 2.01 - 9.7;
    amp *= 0.5;
  }
  return v;
}

/* ---- height map -> tangent-space normal map ---- */
function normalFromHeight(heightCanvas, strength = 2.0){
  const w = heightCanvas.width, h = heightCanvas.height;
  const src = heightCanvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const out = makeCanvas(w, h);
  const octx = out.getContext('2d');
  const img = octx.createImageData(w, h);
  const H = (x, y) => src[((((y + h) % h) * w) + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const dx = (H(x + 1, y) - H(x - 1, y)) * strength;
      const dy = (H(x, y + 1) - H(x, y - 1)) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const inv = 1 / Math.hypot(nx, ny, nz);
      nx *= inv; ny *= inv; nz *= inv;
      const i = (y * w + x) * 4;
      img.data[i] = (nx * 0.5 + 0.5) * 255;
      img.data[i + 1] = (ny * 0.5 + 0.5) * 255;
      img.data[i + 2] = (nz * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  return canvasTexture(out, { linear: true, aniso: 4 });
}

function normalFromField(field, w, h, strength = 2.0){
  const out = makeCanvas(w, h);
  const ctx = out.getContext('2d');
  const img = ctx.createImageData(w, h);
  const H = (x, y) => field[(((y + h) % h) * w) + ((x + w) % w)];
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const dx = (H(x + 1, y) - H(x - 1, y)) * strength;
      const dy = (H(x, y + 1) - H(x, y - 1)) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const inv = 1 / Math.hypot(nx, ny, nz);
      nx *= inv; ny *= inv; nz *= inv;
      const i = (y * w + x) * 4;
      img.data[i] = (nx * 0.5 + 0.5) * 255;
      img.data[i + 1] = (ny * 0.5 + 0.5) * 255;
      img.data[i + 2] = (nz * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvasTexture(out, { linear: true, aniso: 4 });
}

   02 — PROCEDURAL TEXTURES

function makeGrassTexture(size = 1024){
  const r = mulberry32(0xA11CE);
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#54733b';
  ctx.fillRect(0, 0, size, size);

  // broad tonal variation
  for (let i = 0; i < 90; i++){
    const x = r() * size, y = r() * size;
    const rad = size * (0.03 + r() * 0.16);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    const hue = 68 + r() * 44;
    const sat = 24 + r() * 36;
    const lig = 11 + r() * 22;
    g.addColorStop(0, `hsla(${hue},${sat}%,${lig}%,${0.10 + r() * 0.26})`);
    g.addColorStop(1, `hsla(${hue},${sat}%,${lig}%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }
  // dry / soil patches
  for (let i = 0; i < 26; i++){
    const x = r() * size, y = r() * size;
    const rad = size * (0.015 + r() * 0.055);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    const hue = 38 + r() * 22;
    g.addColorStop(0, `hsla(${hue},${24 + r() * 24}%,${18 + r() * 15}%,${0.10 + r() * 0.20})`);
    g.addColorStop(1, `hsla(${hue},20%,18%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }

  // fine blades
  ctx.lineCap = 'round';
  for (let i = 0; i < 26000; i++){
    const x = r() * size, y = r() * size;
    const len = 1.2 + r() * 7.5;
    const lean = (r() - 0.5) * len * 0.8;
    const hue = 72 + r() * 46;
    const sat = 26 + r() * 42;
    const lig = 12 + r() * 31;
    ctx.strokeStyle = `hsla(${hue},${sat}%,${lig}%,${0.14 + r() * 0.42})`;
    ctx.lineWidth = 0.45 + r() * 1.25;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + lean * 0.4, y - len * 0.55, x + lean, y - len);
    ctx.stroke();
  }

  // clover-ish dark patches
  for (let i = 0; i < 900; i++){
    const x = r() * size, y = r() * size;
    ctx.fillStyle = `hsla(${92 + r() * 28},${36 + r() * 20}%,${9 + r() * 10}%,${0.10 + r() * 0.22})`;
    ctx.beginPath();
    ctx.ellipse(x, y, 1 + r() * 2.4, 0.7 + r() * 1.5, r() * 6.28, 0, Math.PI * 2);
    ctx.fill();
  }

  // tiny specks of flower / seed heads
  for (let i = 0; i < 180; i++){
    const x = r() * size, y = r() * size;
    ctx.fillStyle = r() > 0.55 ? `rgba(226,224,178,${0.14 + r() * 0.24})` : `rgba(196,178,96,${0.10 + r() * 0.18})`;
    ctx.fillRect(x, y, 0.9 + r() * 1.2, 0.9 + r() * 1.2);
  }
  return c;
}

function makeGrassNormal(size = 512){
  const r = mulberry32(0xBEEF77);
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#777';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 9000; i++){
    const x = r() * size, y = r() * size;
    const len = 1 + r() * 6;
    const g = 90 + r() * 90;
    ctx.strokeStyle = `rgba(${g},${g},${g},${0.2 + r() * 0.5})`;
    ctx.lineWidth = 0.6 + r() * 1.4;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (r() - 0.5) * 3, y - len);
    ctx.stroke();
  }
  return normalFromHeight(c, 2.6);
}

function makeConcreteTexture(size = 1024){
  const r = mulberry32(0xC0FFEE);
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#858884';
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 80; i++){
    const x = r() * size, y = r() * size;
    const rad = size * (0.02 + r() * 0.12);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    const v = 100 + r() * 55;
    g.addColorStop(0, `rgba(${v},${v + 1},${v - 3},${0.05 + r() * 0.12})`);
    g.addColorStop(1, 'rgba(120,122,118,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }
  // fine aggregate
  for (let i = 0; i < 16000; i++){
    const x = r() * size, y = r() * size;
    const v = 70 + r() * 100;
    ctx.fillStyle = `rgba(${v},${v},${v - 2},${0.05 + r() * 0.22})`;
    ctx.fillRect(x, y, 0.6 + r() * 2.0, 0.6 + r() * 2.0);
  }
  // water stains / moss near joints
  for (let i = 0; i < 15; i++){
    const x = r() * size, y = r() * size;
    const rad = size * (0.03 + r() * 0.09);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, `rgba(58,74,48,${0.05 + r() * 0.13})`);
    g.addColorStop(0.7, `rgba(70,80,62,${0.03 + r() * 0.06})`);
    g.addColorStop(1, 'rgba(70,80,62,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }
  // hairline cracks
  ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++){
    let x = r() * size, y = r() * size;
    ctx.strokeStyle = `rgba(42,45,43,${0.10 + r() * 0.16})`;
    ctx.lineWidth = 0.7 + r() * 1.1;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let j = 0; j < 18; j++){
      x += (r() - 0.5) * 30;
      y += r() * 22;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  return c;
}

function makeGravelTexture(size = 512){
  const r = mulberry32(0x5AAB1E);
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#55554e';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 6000; i++){
    const x = r() * size, y = r() * size;
    const rx = 0.7 + r() * 3.4, ry = 0.6 + r() * 2.5;
    const v = 78 + r() * 105;
    const warm = r() * 12;
    ctx.fillStyle = `rgba(${v + warm},${v + warm * 0.5},${v - 4},${0.35 + r() * 0.5})`;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, r() * 6.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(35,35,31,${0.14 + r() * 0.25})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
  return c;
}

function makeWaterNormal(size = 512){
  const field = new Float32Array(size * size);
  for (let y = 0; y < size; y++){
    for (let x = 0; x < size; x++){
      const u = x / size * Math.PI * 2;
      const v = y / size * Math.PI * 2;
      let h = 0;
      h += Math.sin(u * 3 + v * 2 + 0.4) * 0.34;
      h += Math.sin(u * -2 + v * 5 + 1.8) * 0.22;
      h += Math.sin(u * 7 + v * -3 + 2.6) * 0.10;
      h += Math.sin(u * 4 + v * 8 + 0.9) * 0.08;
      h += Math.sin(u * 13 + v * -11) * 0.035;
      h += fbm(u * 9, v * 9, 3) * 0.20;
      field[y * size + x] = h;
    }
  }
  return normalFromField(field, size, size, 2.0);
}

function makeDropletNormal(size = 512){
  const r = mulberry32(0xD09E7);
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 300; i++){
    const x = r() * size, y = r() * size;
    const rad = 1.4 + Math.pow(r(), 2.2) * 12;
    const g = ctx.createRadialGradient(x - rad * 0.25, y - rad * 0.35, 0, x, y, rad);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.45, 'rgba(160,160,160,0.85)');
    g.addColorStop(0.78, 'rgba(60,60,60,0.9)');
    g.addColorStop(1, 'rgba(128,128,128,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, rad, rad * (0.7 + r() * 0.35), r() * 3.14, 0, Math.PI * 2);
    ctx.fill();
  }
  // long runnels
  for (let i = 0; i < 40; i++){
    const x = r() * size, y = r() * size;
    ctx.strokeStyle = 'rgba(190,190,190,0.4)';
    ctx.lineWidth = 0.5 + r() * 1.8;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + (r() - 0.5) * 12, y + 18 + r() * 32, x + (r() - 0.5) * 14, y + 46 + r() * 60);
    ctx.stroke();
  }
  return normalFromHeight(c, 1.35);
}

function makeLeafMaps(kind = 'green'){
  const W = 256, H = 512;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  const height = makeCanvas(W, H);
  const hctx = height.getContext('2d');
  hctx.fillStyle = '#5a5a5a';
  hctx.fillRect(0, 0, W, H);

  const grad = ctx.createLinearGradient(0, H, 0, 0);
  if (kind === 'red'){
    grad.addColorStop(0.00, '#cfd9a2');
    grad.addColorStop(0.14, '#9fae67');
    grad.addColorStop(0.34, '#6a4a3c');
    grad.addColorStop(0.58, '#55203a');
    grad.addColorStop(1.00, '#33102a');
  } else {
    grad.addColorStop(0.00, '#d3d9a8');
    grad.addColorStop(0.15, '#9bc46d');
    grad.addColorStop(0.45, '#6cae50');
    grad.addColorStop(0.74, '#4d913d');
    grad.addColorStop(1.00, '#2f6b2c');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // lateral shading — darker edges, brighter centre
  const side = ctx.createLinearGradient(0, 0, W, 0);
  side.addColorStop(0, 'rgba(10,30,12,.30)');
  side.addColorStop(0.18, 'rgba(10,30,12,0)');
  side.addColorStop(0.5, 'rgba(255,255,230,.10)');
  side.addColorStop(0.82, 'rgba(10,30,12,0)');
  side.addColorStop(1, 'rgba(10,30,12,.30)');
  ctx.fillStyle = side;
  ctx.fillRect(0, 0, W, H);

  // mottling
  const r = mulberry32(kind === 'red' ? 0x9A11 : 0x61E2);
  for (let i = 0; i < 240; i++){
    const x = r() * W, y = r() * H;
    const rad = 2 + r() * 16;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    if (r() > 0.5) g.addColorStop(0, `rgba(255,255,210,${0.025 + r() * 0.08})`);
    else g.addColorStop(0, `rgba(20,48,16,${0.02 + r() * 0.07})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }

  // midrib + lateral veins
  ctx.lineCap = 'round';
  const midX = W / 2 + 4;
  ctx.strokeStyle = kind === 'red' ? 'rgba(239,201,177,.56)' : 'rgba(217,236,177,.58)';
  ctx.lineWidth = 5.2;
  ctx.beginPath();
  ctx.moveTo(midX, H - 4);
  ctx.bezierCurveTo(midX - 7, H * 0.70, midX + 7, H * 0.36, midX - 2, 4);
  ctx.stroke();
  hctx.strokeStyle = 'rgba(232,232,232,0.95)';
  hctx.lineWidth = 7;
  hctx.beginPath();
  hctx.moveTo(midX, H - 4);
  hctx.bezierCurveTo(midX - 7, H * 0.70, midX + 7, H * 0.36, midX - 2, 4);
  hctx.stroke();

  for (let i = 0; i < 12; i++){
    const t = i / 12;
    const y = H - 18 - t * (H - 42);
    const spread = W * (0.30 + 0.16 * Math.sin(t * 3.0));
    for (const s of [-1, 1]){
      ctx.strokeStyle = kind === 'red' ? 'rgba(231,183,166,.30)' : 'rgba(212,235,174,.30)';
      ctx.lineWidth = 1.3 + (1 - t) * 1.3;
      ctx.beginPath();
      ctx.moveTo(midX, y);
      ctx.bezierCurveTo(midX + s * spread * 0.42, y - 8, midX + s * spread * 0.78, y - 34 - t * 16, midX + s * spread, y - 58 - t * 30);
      ctx.stroke();
      hctx.strokeStyle = 'rgba(226,226,226,.9)';
      hctx.lineWidth = 1.8;
      hctx.beginPath();
      hctx.moveTo(midX, y);
      hctx.bezierCurveTo(midX + s * spread * 0.42, y - 8, midX + s * spread * 0.78, y - 34 - t * 16, midX + s * spread, y - 58 - t * 30);
      hctx.stroke();
    }
  }

  // tiny speckles
  for (let i = 0; i < 500; i++){
    const x = r() * W, y = r() * H;
    ctx.fillStyle = r() > 0.5 ? `rgba(20,45,18,${0.04 + r() * 0.12})` : `rgba(250,255,215,${0.03 + r() * 0.09})`;
    ctx.beginPath(); ctx.arc(x, y, 0.4 + r() * 1.1, 0, Math.PI * 2); ctx.fill();
  }

  // subtle edge wear
  const edge = ctx.createLinearGradient(0, 0, 0, H);
  edge.addColorStop(0, 'rgba(15,35,12,.16)');
  edge.addColorStop(0.15, 'rgba(15,35,12,0)');
  edge.addColorStop(0.9, 'rgba(15,35,12,0)');
  edge.addColorStop(1, 'rgba(15,35,12,.18)');
  ctx.fillStyle = edge;
  ctx.fillRect(0, 0, W, H);

  return {
    map: canvasTexture(c, { aniso: 8 }),
    normal: normalFromHeight(height, 1.6)
  };
}

function makeBarkTexture(){
  const W = 256, H = 512;
  const r = mulberry32(0xBA2C);
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4b4034';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 500; i++){
    const x = r() * W;
    const w = 0.5 + r() * 4;
    const g = 44 + r() * 58;
    ctx.strokeStyle = `rgba(${g + 12},${g},${g - 9},${0.14 + r() * 0.4})`;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.bezierCurveTo(x + (r() - 0.5) * 12, H * 0.3, x + (r() - 0.5) * 12, H * 0.7, x + (r() - 0.5) * 10, H);
    ctx.stroke();
  }
  for (let i = 0; i < 22; i++){
    ctx.fillStyle = `rgba(32,27,22,${0.2 + r() * 0.25})`;
    ctx.beginPath();
    ctx.ellipse(r() * W, r() * H, 1 + r() * 4, 4 + r() * 13, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  return canvasTexture(c, { repeat: [1, 2] });
}

function makeCloudTexture(){
  const W = 1024, H = 512;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(W, H);
  for (let y = 0; y < H; y++){
    const v = y / H;
    const band = smoothstep(0.035, 0.15, v) * (1 - smoothstep(0.35, 0.485, v));
    for (let x = 0; x < W; x++){
      const u = x / W;
      const th = u * Math.PI * 2;
      const nx = Math.cos(th) * 3.4;
      const nz = Math.sin(th) * 3.4;
      const n1 = fbm(nx + 12.0 + v * 1.8, nz + 7.0 + v * 12.0, 5);
      const n2 = fbm(nx * 2.4 + 4.0, nz * 2.4 + v * 16.0, 4);
      let a = smoothstep(0.51, 0.72, n1 * 0.78 + n2 * 0.34) * band;
      a *= smoothstep(0.02, 0.20, v);
      const shade = 0.80 + n2 * 0.34;
      const i = (y * W + x) * 4;
      img.data[i] = 255 * Math.min(1, shade + 0.10);
      img.data[i + 1] = 243 * Math.min(1, shade + 0.03);
      img.data[i + 2] = 229 * shade;
      img.data[i + 3] = a * 232;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function makeFlowerTexture(){
  const S = 128, H = 256;
  const c = makeCanvas(S, H);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, S, H);
  // stem
  ctx.strokeStyle = 'rgba(92,124,62,.95)';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(S / 2, H - 4);
  ctx.quadraticCurveTo(S / 2 + 4, H * 0.62, S / 2 + 1, H * 0.39);
  ctx.stroke();
  // leaves on stem
  ctx.fillStyle = 'rgba(96,132,64,.92)';
  for (const s of [-1, 1]){
    ctx.beginPath();
    ctx.ellipse(S / 2 + s * 8, H * 0.72, 13, 4.4, s * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }
  // petals
  const cx = S / 2, cy = H * 0.31;
  for (let i = 0; i < 9; i++){
    const a = (i / 9) * Math.PI * 2;
    ctx.save();
    ctx.translate(cx + Math.cos(a) * 10, cy + Math.sin(a) * 9);
    ctx.rotate(a);
    const g = ctx.createLinearGradient(0, -5, 0, 5);
    g.addColorStop(0, 'rgba(255,253,238,.98)');
    g.addColorStop(1, 'rgba(225,224,201,.92)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // centre
  const cg = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, 9);
  cg.addColorStop(0, 'rgba(255,224,122,1)');
  cg.addColorStop(1, 'rgba(196,145,43,1)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(cx, cy, 8.5, 0, Math.PI * 2); ctx.fill();
  // subtle stem fuzz
  ctx.strokeStyle = 'rgba(160,185,120,.35)';
  ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(S / 2 - 4, H - 10); ctx.lineTo(S / 2 - 4, H - 64); ctx.stroke();
  return c;
}

function makeSignTexture(){
  const W = 768, H = 512;
  const c = makeCanvas(W, H);

  const bg = ctx.createLinearGradient(0, 0, W, H);

  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(75, 362); ctx.lineTo(W - 75, 362); ctx.stroke();

  ctx.fillStyle = 'rgba(120,170,158,.72)';
  ctx.font = '400 15px ui-monospace, Menlo, monospace';
  ctx.letterSpacing = '3px';
  ctx.fillText('CONTROLLED ENVIRONMENT · EST. 2019', 75, 400);

function makePlaqueTexture(){
  const W = 1024, H = 180;
  const c = makeCanvas(W, H);

function makeSkyTexture(W = 1536, H = 768){
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(W, H);
  const sunH = new THREE.Vector3(SUN_DIR.x, 0, SUN_DIR.z).normalize();
  const zenith = [39, 83, 116];
  const horizonCool = [147, 189, 199];
  const horizonWarm = [255, 196, 145];
  const cloudWarm = [255, 239, 219];
  for (let y = 0; y < H; y++){
    const theta = (y / H) * Math.PI;
    const sy = Math.cos(theta);
    const sinT = Math.sin(theta);
    for (let x = 0; x < W; x++){
      const phi = (x / W) * Math.PI * 2;
      const dx = -Math.cos(phi) * sinT;
      const dz = Math.sin(phi) * sinT;
      let r, g, b;
      if (sy < -0.012){
        const k = smoothstep(-0.012, -0.18, sy);
        r = lerp(118, 48, k);
        g = lerp(127, 54, k);
        b = lerp(118, 47, k);
      } else {
        const elev = Math.max(sy, 0);
        const hd = dx * sunH.x + dz * sunH.z;
        const warm = smoothstep(-0.55, 1.0, hd);
        const hr = lerp(horizonCool[0], horizonWarm[0], warm);
        const hg = lerp(horizonCool[1], horizonWarm[1], warm);
        const hb = lerp(horizonCool[2], horizonWarm[2], warm);
        const k = Math.pow(1 - elev, 3.25);
        r = lerp(zenith[0], hr, k);
        g = lerp(zenith[1], hg, k);
        b = lerp(zenith[2], hb, k);

        const sd = Math.max(0, dx * SUN_DIR.x + sy * SUN_DIR.y + dz * SUN_DIR.z);
        const glow = Math.pow(sd, 5.5) * 0.17 + Math.pow(sd, 42) * 0.55 + Math.pow(sd, 1100) * 2.8;
        r += 255 * glow * 0.95;
        g += 216 * glow * 0.82;
        b += 168 * glow * 0.64;

        // a high, wispy cloud deck
        const inv = 1 / Math.max(sy, 0.042);
        const px = dx * inv * 0.72 + 9.0;
        const pz = dz * inv * 0.72 - 4.0;
        const n = fbm(px * 1.45, pz * 1.45, 5);
        const n2 = fbm(px * 3.7 - 3.1, pz * 3.7 + 6.4, 4);
        let cl = smoothstep(0.56, 0.78, n * 0.80 + n2 * 0.28);
        const band = smoothstep(0.025, 0.11, sy) * (1 - smoothstep(0.29, 0.48, sy));
        cl *= band * 0.24;
        const warmCloud = smoothstep(-0.8, 1.0, hd);
        const cr = lerp(204, cloudWarm[0], warmCloud);
        const cg = lerp(212, cloudWarm[1], warmCloud);
        const cb = lerp(214, cloudWarm[2], warmCloud);
        r = lerp(r, cr, cl);
        g = lerp(g, cg, cl);
        b = lerp(b, cb, cl);
      }
      const i = (y * W + x) * 4;
      img.data[i] = clamp(r, 0, 255);
      img.data[i + 1] = clamp(g, 0, 255);
      img.data[i + 2] = clamp(b, 0, 255);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function makeBladeGeometry(height, width, bend, segs = 4){
  const pos = [], colArr = [], idx = [];
  const cBase = new THREE.Color(0.24, 0.35, 0.16);
  const cTip = new THREE.Color(0.82, 0.93, 0.55);
  for (let i = 0; i <= segs; i++){
    const t = i / segs;
    const w = width * Math.pow(1 - t, 0.72) + 0.0015;
    const y = t * height;
    const z = bend * t * t * height;
    pos.push(-w, y, z, w, y, z);
    const c = cBase.clone().lerp(cTip, Math.pow(t, 0.7));
    colArr.push(c.r, c.g, c.b, c.r, c.g, c.b);
  }
  for (let i = 0; i < segs; i++){
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colArr, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function makeGrassTuftGeometry(seed = 1){
  const r = mulberry32(seed);
  const parts = [];
  const blades = 5;
  for (let i = 0; i < blades; i++){
    const h = 0.10 + r() * 0.16;
    const w = 0.016 + r() * 0.017;
    const bend = 0.16 + r() * 0.48;
    const g = makeBladeGeometry(h, w, bend, 4);
    const mat = new THREE.Matrix4().compose(
      new THREE.Vector3((r() - 0.5) * 0.115, 0, (r() - 0.5) * 0.115),
      new THREE.Quaternion().setFromEuler(new THREE.Euler((r() - 0.5) * 0.24, r() * Math.PI * 2, (r() - 0.5) * 0.3, 'YXZ')),
      new THREE.Vector3(1, 1, 1)
    );
    g.applyMatrix4(mat);
    parts.push(g);
  }
  return mergeGeometries(parts, false);
}

const sharedWind = { value: 0 };
const sharedWindy = { value: 0 };

function injectWind(material, strength = 1.0, flutter = 0.0){
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = sharedWind;
    shader.uniforms.uFlutter = sharedWindy;
    shader.vertexShader = 'uniform float uTime;\nuniform float uFlutter;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      #include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      #else
        vec3 ip = vec3(0.0);
      #endif
      float hh = max(transformed.y, 0.0);
      float sway = sin(uTime * 1.28 + ip.x * 0.36 + ip.z * 0.29) * 0.62
                 + sin(uTime * 2.27 + ip.x * 0.83 + ip.z * 0.71) * 0.25
                 + sin(uTime * 0.57 + ip.z * 0.18) * 0.28;
      transformed.x += sway * hh * hh * ${(0.46 * strength).toFixed(3)};
      transformed.z += sway * hh * hh * ${(0.28 * strength).toFixed(3)};
      transformed.y += sin(uTime * 4.2 + ip.x * 1.7 + transformed.x * 8.0) * uFlutter * hh * hh;
      `
    );
  };
  material.customProgramCacheKey = () => 'wind' + strength + '_' + flutter;
}

// The interior accent lights are a few metres from the glass and fall to
// nothing by the time they reach the meadow, but the GPU still evaluates
// them for every grass pixel. Outdoor materials compile without them.
function outdoorOnly(material){
  const prev = material.onBeforeCompile;
  const prevKey = material.customProgramCacheKey ? material.customProgramCacheKey() : '';
  material.onBeforeCompile = (shader, r) => {
    if (prev) prev(shader, r);
    // three substitutes the light counts into the chunk text, so patch the
    // two lighting chunks with a point-light count of zero
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <lights_pars_begin>', THREE.ShaderChunk.lights_pars_begin.replaceAll('NUM_POINT_LIGHTS', '0'))
      .replace('#include <lights_fragment_begin>', THREE.ShaderChunk.lights_fragment_begin.replaceAll('NUM_POINT_LIGHTS', '0'));
  };
  material.customProgramCacheKey = () => prevKey + '_out';
  return material;
}

function makeCanopyGeometry(seed, blobCount = 11){
  const r = mulberry32(seed);
  const parts = [];
  for (let b = 0; b < blobCount; b++){
    const g = new THREE.IcosahedronGeometry(1, 2);
    const p = g.attributes.position;
    const ox = (r() - 0.5) * 0.4, oy = (r() - 0.5) * 0.4, oz = (r() - 0.5) * 0.4;
    for (let i = 0; i < p.count; i++){
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const n = 0.74 + fbm(x * 2.1 + ox * 7, z * 2.1 + oy * 7, 3) * 0.52 + fbm(y * 2.4 + 3, x * 2.4 - 1, 2) * 0.16;
      p.setXYZ(i, x * n, y * n, z * n);
    }
    g.computeVertexNormals();
    const a = r() * Math.PI * 2;
    const spread = b === 0 ? 0 : Math.pow(r(), 0.58) * 1.28;
    const s = 0.55 + r() * 0.72;
    const m = new THREE.Matrix4().compose(
      new THREE.Vector3(Math.cos(a) * spread * 1.18, (r() - 0.38) * 1.45, Math.sin(a) * spread),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(r() * 3, r() * 3, r() * 3)),
      new THREE.Vector3(s * 1.08, s * (0.8 + r() * 0.35), s)
    );
    g.applyMatrix4(m);
    parts.push(g);
  }
  const merged = mergeGeometries(parts, false);
  merged.computeVertexNormals();
  const p = merged.attributes.position;
  const colors = new Float32Array(p.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = fbm(x * 1.5 + 5.4, z * 1.5 - 2.1, 3);
    const shade = clamp(0.42 + (y + 1.4) * 0.18 + n * 0.22, 0.25, 1.0);
    c.setHSL(0.255 + n * 0.055, 0.44 + n * 0.14, 0.10 + shade * 0.17);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }
  merged.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return merged;
}

function makeConiferGeometry(seed){
  const r = mulberry32(seed);
  const parts = [];
  for (let i = 0; i < 5; i++){
    const t = i / 5;
    const g = new THREE.ConeGeometry(1 - t * 0.62, 0.46, 9, 2);
    g.translate((r() - 0.5) * 0.05, 0.19 + i * 0.17, (r() - 0.5) * 0.05);
    g.rotateY(r() * Math.PI);
    parts.push(g);
  }
  const merged = mergeGeometries(parts, false);
  merged.computeVertexNormals();
  const p = merged.attributes.position;
  const colors = new Float32Array(p.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    const y = p.getY(i);
    const n = vnoise(p.getX(i) * 8, p.getZ(i) * 8);
    c.setHSL(0.315 + n * 0.03, 0.36 + n * 0.14, 0.09 + clamp(y, 0, 1) * 0.10 + n * 0.035);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  merged.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return merged;
}

function makeBarGeo(x1, y1, z1, x2, y2, z2, t = 0.09){
  const a = new THREE.Vector3(x1, y1, z1);
  const b = new THREE.Vector3(x2, y2, z2);
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-4) return null;
  const g = new THREE.BoxGeometry(t, len, t);
  const q = new THREE.Quaternion().setFromUnitVectors(UP, dir.normalize());
  const mid = a.add(b).multiplyScalar(0.5);
  g.applyMatrix4(new THREE.Matrix4().compose(mid, q, new THREE.Vector3(1, 1, 1)));
  return g;
}
function addBar(arr, x1, y1, z1, x2, y2, z2, t = 0.09){
  const g = makeBarGeo(x1, y1, z1, x2, y2, z2, t);
  if (g) arr.push(g);
}
function addCylinder(arr, r, len, x, y, z, axis = 'y', seg = 10){
  const g = new THREE.CylinderGeometry(r, r, len, seg, 1);
  if (axis === 'x') g.rotateZ(Math.PI / 2);
  else if (axis === 'z') g.rotateX(Math.PI / 2);
  g.translate(x, y, z);
  arr.push(g);
}
function addPanelGeo(w, h, x, y, z, ry = 0, rx = 0, rz = 0){
  const g = new THREE.PlaneGeometry(w, h, 1, 1);

function makeLeafGeometry({ length, width, bend, cup, twist, phase, segU = 6, segV = 4, ruffle = 0, round = 0 }){
  const positions = [], uvs = [], colors = [], indices = [];
  const step = length / segU;
  let cy = 0, cz = 0;
  const centers = [[0, 0]];
  for (let i = 1; i <= segU; i++){
    const t = i / segU;
    const angle = bend * Math.pow(t, 1.30);
    cy += Math.cos(angle) * step;
    cz += Math.sin(angle) * step;
    centers.push([cy, cz]);
  }
  const cBase = new THREE.Color(0.50, 0.56, 0.44);
  const cTip = new THREE.Color(1.0, 1.0, 0.92);
  for (let i = 0; i <= segU; i++){
    const u = i / segU;
    // round > 0 gives the blunt, spoon-shaped blade of butterhead / romaine
    const prof = Math.sin(Math.PI * Math.pow(u, lerp(0.58, 0.78, round)));
    const wBase = width * Math.pow(prof, lerp(1.0, 0.5, round)) * lerp(1.0, 0.35 + 0.65 * smoothstep(0.0, 0.35, u), round);
    const w = wBase * (1 + 0.085 * Math.sin(u * 31 + phase) + 0.045 * Math.sin(u * 63 + phase * 1.7));
    const [yy, zz] = centers[i];
    for (let j = 0; j <= segV; j++){
      const v = (j / segV) * 2 - 1;
      const xx = v * w;
      const edgeK = Math.pow(Math.abs(v), 2.2) * smoothstep(0.15, 0.6, u);
      const cupY = cup * w * v * v
        + ruffle * w * edgeK * (Math.sin(u * 38 + v * 2.0 + phase) * 0.7 + Math.sin(u * 83 + phase * 2.3) * 0.3);
      const tw = twist * u;
      const xr = xx * Math.cos(tw);
      const yr = cupY + xx * Math.sin(tw);
      positions.push(xr, yy + yr, zz);
      uvs.push(j / segV, u);
      const tone = 0.55 + 0.45 * Math.sin(Math.PI * Math.pow(u, 0.7));
      const edge = 0.88 + 0.12 * (1 - Math.abs(v));
      const c = cBase.clone().lerp(cTip, tone).multiplyScalar(edge);
      colors.push(c.r, c.g, c.b);
    }
  }
  const stride = segV + 1;
  for (let i = 0; i < segU; i++){
    for (let j = 0; j < segV; j++){
      const a = i * stride + j;
      const b = a + 1;
      const c = a + stride;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

function makePlantGeometry(seed, size = 1, leafBias = 1, style = {}){
  const ruffle = style.ruffle ?? 0.32, round = style.round ?? 0.85, segU = style.segU ?? 8, segV = style.segV ?? 6;
  const r = mulberry32(seed);
  const parts = [];
  const countOuter = 10 + Math.floor(r() * 3);
  const countInner = 7 + Math.floor(r() * 3);
  const base = new THREE.Euler();
  for (let layer = 0; layer < 2; layer++){
    const count = layer === 0 ? countOuter : countInner;
    for (let i = 0; i < count; i++){
      const outer = layer === 0;
      const len = (outer ? 0.30 + r() * 0.13 : 0.19 + r() * 0.10) * size * leafBias;
      const wid = (outer ? 0.115 + r() * 0.045 : 0.075 + r() * 0.035) * size;
      const bend = (outer ? 1.05 + r() * 0.72 : 0.35 + r() * 0.62) * (0.94 + r() * 0.13);
      const cup = 0.20 + r() * 0.32;
      const twist = (r() - 0.5) * 0.8;
      const phase = r() * 10;
      const g = makeLeafGeometry({ length: len, width: wid * (1 + round * 0.18), bend, cup, twist, phase, segU, segV, ruffle: ruffle * (outer ? 1 : 0.6), round });
      const yaw = (i / count) * Math.PI * 2 + r() * 0.6;
      const tilt = outer ? 0.48 + r() * 0.50 : 0.04 + r() * 0.36;
      const roll = (r() - 0.5) * 0.7;
      base.set(tilt, yaw, roll, 'YXZ');
      const m = new THREE.Matrix4().compose(
        new THREE.Vector3((r() - 0.5) * 0.01, 0.005 + (outer ? 0 : 0.02 + r() * 0.035), (r() - 0.5) * 0.01),
        new THREE.Quaternion().setFromEuler(base),
        new THREE.Vector3(1, 1, 1)
      );
      g.applyMatrix4(m);
      parts.push(g);
    }
  }
  const merged = mergeGeometries(parts, false);
  merged.computeBoundingSphere();
  return merged;
}

// Grow-bar light. Real area lights cost every pixel in the scene, so the
// four bars are instead integrated analytically as line lights, and only
// in the materials that sit under them (beds, rafts, water, plants).
const ledUniform = { value: new THREE.Vector4(1, 1, 1, 1) };   // level per bar
const LED_LINES = BED_Z.flatMap(cz => [cz - 0.86, cz + 0.86]);
function addLedGlow(material, strength = 1){
  const prev = material.onBeforeCompile;
  const prevKey = material.customProgramCacheKey ? material.customProgramCacheKey() : '';
  material.onBeforeCompile = (shader, r) => {
    if (prev) prev(shader, r);
    shader.uniforms.uLed = ledUniform;
    shader.fragmentShader = 'uniform vec4 uLed;\n' + shader.fragmentShader.replace(
      '#include <lights_fragment_end>',
      `
      #include <lights_fragment_end>
      #ifdef USE_FOG
      {
        vec3 wp = cameraPosition + vFogDir;
        vec3 wn = inverseTransformDirection(normal, viewMatrix);
        float irr = 0.0;
        ${LED_LINES.map((z, k) => `
        {
          vec2 dp = vec2(2.673 - wp.y, ${z.toFixed(3)} - wp.z);
          float d = max(length(dp), 0.05);
          float a = atan((12.2 - wp.x) / d) - atan((-12.2 - wp.x) / d);
          irr += a / d * max(dot(wn, vec3(0.0, dp / d)), 0.0) * uLed[${k}];
        }`).join('')}
        reflectedLight.directDiffuse += BRDF_Lambert(material.diffuseColor) * irr * vec3(1.0, 0.42, 0.66) * ${(0.66 * strength).toFixed(3)};
      }
      #endif
      `
    );
  };
  material.customProgramCacheKey = () => prevKey + '_led' + strength;
}

  ctx.fillText(now.toTimeString().slice(0, 8), 420, 30);

  const z = state.zone === 'all' ? 0 : state.zone;
  const ts = nowSec();
  const kpis = [
    ['pH', fmt('ph', sampleZone('ph', z, ts)), 'rgba(255,143,208,.95)'],

    ['H2O °C', fmt('waterTemp', sampleZone('waterTemp', z, ts)), 'rgba(132,216,255,.92)']
  ];
  kpis.forEach((k, i) => {
    const x = 22 + i * 120;

    ctx.font = '400 9px ui-monospace, Menlo, monospace';

  });

  // mini trend
  {

  }
  if (screenHistory.length > 74) screenHistory.shift();
  const gx = 22, gy = 132, gw = 466, gh = 104;
  ctx.strokeStyle = 'rgba(87,255,192,.07)';
  ctx.strokeRect(gx, gy, gw, gh);
  ctx.beginPath();
  screenHistory.forEach((v, i) => {
    const x = gx + (i / (screenHistory.length - 1)) * gw;
    const y = gy + gh - clamp(v, 0.12, 0.88) * gh;

  ctx.strokeStyle = 'rgba(87,255,192,.9)';
  ctx.lineWidth = 1.7;
  ctx.stroke();
  ctx.lineTo(gx + gw, gy + gh);
  ctx.lineTo(gx, gy + gh);
  ctx.closePath();
  const area = ctx.createLinearGradient(0, gy, 0, gy + gh);
  area.addColorStop(0, 'rgba(87,255,192,.20)');

function makeGaugeTexture(label, value){
  const S = 256;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const cx = S / 2, cy = S / 2, R = 106;
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = '#dfe5dc';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2a3531';
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(cx, cy, R - 4, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#16211d';
  ctx.font = '600 26px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label, cx, cy + 54);
  for (let i = 0; i <= 20; i++){
    const a = Math.PI * 0.76 + (i / 20) * Math.PI * 1.48;
    const r0 = R - 17, r1 = R - (i % 5 === 0 ? 32 : 25);
    ctx.strokeStyle = '#34433d';
    ctx.lineWidth = i % 5 === 0 ? 3 : 1.2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.stroke();
  }
  const na = Math.PI * 0.76 + (0.12 + value * 0.72) * Math.PI * 1.48;
  ctx.strokeStyle = '#c04a3f';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(na) * 74, cy + Math.sin(na) * 74); ctx.stroke();
  ctx.fillStyle = '#222d28';
  ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.fill();
  const tex = canvasTexture(c, { aniso: 4 });
  return tex;
}

  for (let i = 0; i < 3; i++){

    rod.position.set(0, 1.02, 0);
    g.add(rod);
  }
  scene.add(g);
  fanSpinners.push({ spinner, speed, baseY: ry, wobble: rand() * 6 });
  return g;
}

/* =========================================================================

function makeParticleTexture(size = 96){
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,255,255,.9)');
  g.addColorStop(0.32, 'rgba(240,255,248,.32)');
  g.addColorStop(1, 'rgba(220,255,240,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return canvasTexture(c, { aniso: 2 });
}
const particleTex = makeParticleTexture();

function makeParticleSystem(count, bounds, size, opacity, color, speed){
  const positions = new Float32Array(count * 3);
  const seeds = new Float32Array(count);
  for (let i = 0; i < count; i++){
    positions[i * 3] = bounds.x[0] + rand() * (bounds.x[1] - bounds.x[0]);
    positions[i * 3 + 1] = bounds.y[0] + rand() * (bounds.y[1] - bounds.y[0]);
    positions[i * 3 + 2] = bounds.z[0] + rand() * (bounds.z[1] - bounds.z[0]);
    seeds[i] = rand() * 100;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    size,
    map: particleTex,
    transparent: true,
    opacity,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
    color,
    toneMapped: false
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  scene.add(points);
  return { points, geo, positions, seeds, bounds, speed, count };
}
const dust = makeParticleSystem(850, {
  x: [-15.2, 15.2], y: [0.6, 7.4], z: [-8.0, 8.0]

const pollen = makeParticleSystem(700, {

}, 0.095, 0.16, 0xfff0c2, 0.16);

function updateParticles(sys, t, dt){
  const b = sys.bounds;
  const p = sys.positions;
  for (let i = 0; i < sys.count; i++){
    const i3 = i * 3;
    p[i3] += (Math.sin(t * 0.31 + sys.seeds[i] * 1.7) * 0.035 + sys.speed * 0.22) * dt;
    p[i3 + 1] += (Math.sin(t * 0.23 + sys.seeds[i]) * 0.020 + sys.speed * 0.10) * dt;
    p[i3 + 2] += Math.cos(t * 0.27 + sys.seeds[i] * 1.3) * 0.032 * dt;
    if (p[i3] > b.x[1]) p[i3] = b.x[0];
    if (p[i3] < b.x[0]) p[i3] = b.x[1];
    if (p[i3 + 1] > b.y[1]) p[i3 + 1] = b.y[0];
    if (p[i3 + 1] < b.y[0]) p[i3 + 1] = b.y[1];
    if (p[i3 + 2] > b.z[1]) p[i3 + 2] = b.z[0];
    if (p[i3 + 2] < b.z[0]) p[i3 + 2] = b.z[1];
  }
  sys.geo.attributes.position.needsUpdate = true;
}

/* =========================================================================
   22 — POST PROCESSING
   ========================================================================= */
const renderTarget = new THREE.WebGLRenderTarget(1, 1, {
  type: THREE.HalfFloatType,
  // on high-DPI screens every CSS pixel already holds ~2.5 render pixels,
  // so 2x MSAA looks identical to 4x there at a fraction of the bandwidth
  samples: QUERY.has('msaa') ? +QUERY.get('msaa') : (PIXEL_RATIO >= 1.5 ? 2 : 4),
  depthTexture: new THREE.DepthTexture(1, 1)   // resolved from MSAA; feeds the focus pass
});
const composer = new EffectComposer(renderer, renderTarget);
composer.setPixelRatio(PIXEL_RATIO);
composer.setSize(window.innerWidth, window.innerHeight);

composer.addPass(new RenderPass(scene, camera));

/* ---- ground-truth ambient occlusion ----
   Glass and other see-through surfaces are flagged userData.noAO so the
   occlusion (and the depth used for focus below) is computed on what is
   behind them — the beds, plants and frames. */
const gtao = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
{
  // occlusion is low-frequency: half resolution is plenty and ~4x cheaper
  const fullSetSize = gtao.setSize.bind(gtao);
  gtao.setSize = (w, h) => fullSetSize(Math.max(1, Math.round(w * 0.5)), Math.max(1, Math.round(h * 0.5)));
}
gtao.output = GTAOPass.OUTPUT.Default;
gtao.blendIntensity = 0.92;
gtao.updateGtaoMaterial({ radius: 0.9, distanceExponent: 1.6, thickness: 1.4, distanceFallOff: 1.0, scale: 1.0, samples: 16 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 7, rings: 2, samples: 16 });
gtao.setSceneClipBox(new THREE.Box3(new THREE.Vector3(-60, -1, -60), new THREE.Vector3(60, 14, 60)));
{
  const baseOverride = gtao.overrideVisibility.bind(gtao);
  gtao.overrideVisibility = function(){
    baseOverride();
    scene.traverse(o => { if (o.userData.noAO) o.visible = false; });
  };
}
{
  // compute-only: the occlusion is applied inside the final pass instead of
  // by GTAO's own copy + blend (two full-resolution passes saved)
  gtao.needsSwap = false;
  gtao.render = function(r){
    if (this._renderGBuffer){
      this.overrideVisibility();
      this.renderOverride(r, this.normalMaterial, this.normalRenderTarget, 0x7777ff, 1.0);
      this.restoreVisibility();
    }
    const u = this.gtaoMaterial.uniforms;
    u.cameraNear.value = this.camera.near;
    u.cameraFar.value = this.camera.far;
    u.cameraProjectionMatrix.value.copy(this.camera.projectionMatrix);
    u.cameraProjectionMatrixInverse.value.copy(this.camera.projectionMatrixInverse);
    u.cameraWorldMatrix.value.copy(this.camera.matrixWorld);
    this.renderPass(r, this.gtaoMaterial, this.gtaoRenderTarget, 0xffffff, 1.0);
    this.pdMaterial.uniforms.cameraProjectionMatrixInverse.value.copy(this.camera.projectionMatrixInverse);
    this.renderPass(r, this.pdMaterial, this.pdRenderTarget, 0xffffff, 1.0);
  };
}
composer.addPass(gtao);

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.36, 0.68, 1.02
);
// bloom stops after compositing its mips; the final pass adds the glow,
// which saves UnrealBloom's own full-resolution additive copy
bloom.render = function(r, writeBuffer, readBuffer){
  r.getClearColor(this._oldClearColor);
  this.oldClearAlpha = r.getClearAlpha();
  const oldAutoClear = r.autoClear;
  r.autoClear = false;
  r.setClearColor(this.clearColor, 0);
  this.highPassUniforms.tDiffuse.value = readBuffer.texture;
  this.highPassUniforms.luminosityThreshold.value = this.threshold;
  this.fsQuad.material = this.materialHighPassFilter;
  r.setRenderTarget(this.renderTargetBright); r.clear(); this.fsQuad.render(r);
  let input = this.renderTargetBright;
  for (let i = 0; i < this.nMips; i++){
    const m = this.separableBlurMaterials[i];
    this.fsQuad.material = m;
    m.uniforms.colorTexture.value = input.texture;
    m.uniforms.direction.value = UnrealBloomPass.BlurDirectionX;
    r.setRenderTarget(this.renderTargetsHorizontal[i]); r.clear(); this.fsQuad.render(r);
    m.uniforms.colorTexture.value = this.renderTargetsHorizontal[i].texture;
    m.uniforms.direction.value = UnrealBloomPass.BlurDirectionY;
    r.setRenderTarget(this.renderTargetsVertical[i]); r.clear(); this.fsQuad.render(r);
    input = this.renderTargetsVertical[i];
  }
  this.fsQuad.material = this.compositeMaterial;
  this.compositeMaterial.uniforms.bloomStrength.value = this.strength;
  this.compositeMaterial.uniforms.bloomRadius.value = this.radius;
  this.compositeMaterial.uniforms.bloomTintColors.value = this.bloomTintColors;
  r.setRenderTarget(this.renderTargetsHorizontal[0]); r.clear(); this.fsQuad.render(r);
  r.setClearColor(this._oldClearColor, this.oldClearAlpha);
  r.autoClear = oldAutoClear;
};
composer.addPass(bloom);

/* ---- final pass ----
   One full-screen shader does everything after bloom: ambient occlusion,
   lens focus, ACES tone mapping, sRGB, chromatic aberration, split-tone
   grade, vignette and grain. Previously five passes over a 4K target. */
const finalShader = {
  uniforms: {
    tDiffuse: { value: null },
    tDepth: { value: null },
    tAO: { value: null },
    tBloom: { value: null },
    uBloom: { value: 1 },
    uAO: { value: 0.92 },
    uRes: { value: new THREE.Vector2(1, 1) },
    uNear: { value: camera.near },
    uFar: { value: camera.far },
    uFocus: { value: 40 },
    uMaxR: { value: 4.0 },
    uDof: { value: 1 },
    uGrade: { value: 1 },
    uExposure: { value: 1 },
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse, tDepth, tAO, tBloom;
    uniform float uBloom;
    uniform vec2 uRes;
    uniform float uAO, uNear, uFar, uFocus, uMaxR, uDof, uGrade, uExposure, uTime;
    varying vec2 vUv;

    float linDepth(vec2 uv){
      float z = texture2D(tDepth, uv).x * 2.0 - 1.0;
      return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear));
    }
    float coc(float z){
      float farB = smoothstep(uFocus * 1.45, uFocus * 5.0, z);
      float nearB = 1.0 - smoothstep(uFocus * 0.07, uFocus * 0.3, z);
      return clamp(max(farB, nearB * 0.6) * uDof, 0.0, 1.0);
    }
    vec3 hdr(vec2 uv){
      vec3 c = texture2D(tDiffuse, uv).rgb;
      return c * mix(1.0, texture2D(tAO, uv).r, uAO);
    }
    vec3 veraRRT(vec3 v){
      vec3 a = v * (v + 0.0245786) - 0.000090537;
      vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
      return a / b;
    }
    vec3 veraACES(vec3 c){
      const mat3 I = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));
      const mat3 O = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
      c *= uExposure / 0.6;
      return clamp(O * veraRRT(I * c), 0.0, 1.0);
    }
    vec3 toSRGB(vec3 c){
      return mix(pow(c, vec3(0.41666)) * 1.055 - 0.055, c * 12.92, vec3(lessThanEqual(c, vec3(0.0031308))));
    }
    float hash12(vec2 p){
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    void main(){
      vec2 cv = vUv - 0.5;
      float c0 = coc(linDepth(vUv));
      vec3 col;
      if (c0 < 0.02){
        // in focus: lateral chromatic aberration toward the frame edge
        float ca = (0.0007 + dot(cv, cv) * 0.0034) * uGrade;
        vec3 m = hdr(vUv);
        col = vec3(hdr(vUv + cv * ca).r, m.g, hdr(vUv - cv * ca).b);
      } else {
        vec3 acc = hdr(vUv);
        float wsum = 1.0;
        for (int i = 0; i < 20; i++){
          float fi = float(i) + 0.5;
          float r = sqrt(fi / 20.0) * c0 * uMaxR;
          float a = fi * 2.39996323;
          vec2 suv = vUv + vec2(cos(a), sin(a)) * r / uRes;
          float w = clamp(coc(linDepth(suv)) / c0 * 1.6, 0.0, 1.0);
          acc += hdr(suv) * w;
          wsum += w;
        }
        col = acc / wsum;
      }
      col += texture2D(tBloom, vUv).rgb * uBloom;
      col = toSRGB(veraACES(col));
      if (uGrade > 0.5){
        float vig = smoothstep(1.18, 0.32, length(cv) * 1.34);
        col *= mix(0.68, 1.0, vig);
        float l = dot(col, vec3(0.299, 0.587, 0.114));
        col *= mix(vec3(0.94, 1.01, 1.045), vec3(1.045, 1.005, 0.945), smoothstep(0.10, 0.80, l));
        col += vec3(-0.002, 0.004, 0.005) * (1.0 - smoothstep(0.0, 0.4, l));
        col = (col - 0.5) * 1.04 + 0.5;
        col += (hash12(vUv * uRes + fract(uTime) * 941.0) - 0.5) * 0.016;
      }
      gl_FragColor = vec4(col, 1.0);
    }
  `
};
const finalPass = new ShaderPass(finalShader);
finalPass.needsSwap = false;
{
  const baseRender = finalPass.render.bind(finalPass);
  finalPass.render = (r, writeBuffer, readBuffer, dt, mask) => {
    const u = finalPass.uniforms;
    u.tDepth.value = readBuffer.depthTexture;
    u.tAO.value = gtao.pdRenderTarget.texture;
    u.tBloom.value = bloom.renderTargetsHorizontal[0].texture;
    u.uBloom.value = bloom.enabled ? 1 : 0;
    u.uAO.value = gtao.enabled ? 0.92 : 0.0;
    u.uExposure.value = renderer.toneMappingExposure;
    baseRender(r, writeBuffer, readBuffer, dt, mask);
  };
}
composer.addPass(finalPass);
// aliases kept for the resize / animation code
const focusPass = finalPass, gradePass = finalPass;

/* =========================================================================
   23 — TELEMETRY MODEL
   Every reading is a deterministic function of wall-clock time, so the live
   stream, the 24-hour history and the in-scene control screen all agree.
   Shapes follow real deep-water-culture behaviour: pH creeps up as plants
   feed and is knocked back by acid dosing, EC falls between top-ups, the
   reservoir drains and refills, climate follows the day.
   ========================================================================= */
const METRICS = [
  { id: 'airTemp',   label: 'Air Temp',   unit: '°C',    dec: 1, color: '#5fffc4', scope: 'bay',  lo: 20,   hi: 26,   micro: 0.10 },
  { id: 'humidity',  label: 'Humidity',   unit: '%',     dec: 0, color: '#59d2ff', scope: 'bay',  lo: 55,   hi: 75,   micro: 0.8 },
  { id: 'vpd',       label: 'VPD',        unit: 'kPa',   dec: 2, color: '#c3f07a', scope: 'bay',  lo: 0.8,  hi: 1.25, micro: 0 },
  { id: 'co2',       label: 'CO₂',        unit: 'ppm',   dec: 0, color: '#a98bff', scope: 'bay',  lo: 800,  hi: 1200, micro: 9 },
  { id: 'par',       label: 'PAR',        unit: 'µmol',  dec: 0, color: '#ffd166', scope: 'bay',  lo: 350,  hi: 600,  micro: 5 },
  { id: 'waterTemp', label: 'Water Temp', unit: '°C',    dec: 1, color: '#4ff0ff', scope: 'zone', lo: 18,   hi: 22,   micro: 0.04 },
  { id: 'ph',        label: 'pH',         unit: '',      dec: 2, color: '#ff8fd0', scope: 'zone', lo: 5.6,  hi: 6.2,  micro: 0.016 },
  { id: 'ec',        label: 'EC',         unit: 'mS/cm', dec: 2, color: '#ffb35c', scope: 'zone', lo: 1.6,  hi: 2.1,  micro: 0.008 },
  { id: 'do2',       label: 'Dissolved O₂', unit: 'mg/L', dec: 1, color: '#7ef7c8', scope: 'zone', lo: 6.5,  hi: 9.5,  micro: 0.06 },
  { id: 'level',     label: 'Reservoir',  unit: '%',     dec: 0, color: '#b0ff7a', scope: 'zone', lo: 70,   hi: 98,   micro: 0.15 }
];
const METRIC = Object.fromEntries(METRICS.map(m => [m.id, m]));

const PH_PERIOD = 7800, EC_PERIOD = 6.5 * 3600, LEVEL_PERIOD = 9 * 3600, CO2_PERIOD = 1500;
const ZONE_PHASE = [0, 0.43];

const frac = x => x - Math.floor(x);
function hourOf(t){
  const d = new Date(t * 1000);
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
// smooth pseudo-noise: incommensurate sines, unique per metric + zone
function wobble(t, seed){
  return (Math.sin(t * 0.83 + seed * 1.7) * 0.42 + Math.sin(t * 0.37 + seed * 4.1) * 0.33
        + Math.sin(t * 0.151 + seed * 2.3) * 0.5 + Math.sin(t * 0.0613 + seed) * 0.45
        + Math.sin(t * 2.31 + seed * 7.9) * 0.16) / 1.4;
}
const daylight = h => clamp(Math.sin((h - 6.2) / 13.6 * Math.PI), 0, 1);
const LIGHTS_ON = 5, LIGHTS_OFF = 23;
const lightsOn = h => h >= LIGHTS_ON && h < LIGHTS_OFF;
// diurnal heat curve, lagging the sun by ~2h
const heat = h => 0.5 + 0.5 * Math.sin((h - 9.0) / 24 * Math.PI * 2);

// live effects of the equipment on the readings (only the present moment;
// history keeps the automated behaviour it actually had)
const FX = { light: [1, 1], air: [1, 1], chill: [0, 0], vent: 0 };
function sampleZone(id, z, t, microK = 1){
  if (Date.now() / 1000 - t <= 4 && typeof liveValue === 'function'){
    const lv = liveValue(id, z);
    if (lv !== undefined) return lv;
  }
  const v = sampleZoneBase(id, z, t, microK);
  if (Date.now() / 1000 - t > 4) return v;
  if (id === 'par') return v * FX.light[z];
  if (id === 'do2') return v - (1 - FX.air[z]) * 3.2;
  if (id === 'humidity') return v - FX.vent * 6 + (1 - Math.min(1, fanFactor)) * 5;
  if (id === 'waterTemp') return v + FX.chill[z];
  if (id === 'airTemp') return v - FX.vent * 0.8;
  return v;
}
function sampleZoneBase(id, z, t, microK = 1){
  const h = hourOf(t);
  const m = METRIC[id];
  const n = wobble(t, id.length * 3.1 + z * 11.7) * m.micro * microK;
  const ph = ZONE_PHASE[z];
  switch (id){
    case 'airTemp':  return 21.0 + 3.6 * heat(h) + 0.6 * daylight(h) + n;
    case 'humidity': return 73.5 - 11 * heat(h) + n;
    case 'vpd': {
      const T = sampleZone('airTemp', z, t, microK), RH = sampleZone('humidity', z, t, microK);
      const svp = 0.6108 * Math.exp(17.27 * T / (T + 237.3));
      return svp * (1 - RH / 100);
    }
    case 'co2': {
      const photo = lightsOn(h) ? 1 : 0;
      return 1080 - 190 * photo * (0.7 + 0.3 * daylight(h)) + 70 * (1 - frac(t / CO2_PERIOD)) * photo + n;
    }

function applyControls(dt, t){
  for (let b = 0; b < 2; b++){
    const k = `b${b}`;
    const f = eff(k, 'lights') / 100;
    const breath = 1 + Math.sin(t * 0.55 + b) * 0.025;
    ledBedMats[b].emissiveIntensity = 4.2 * f * breath;
    ledBedMats[b].color.setRGB(lerp(0.23, 1, f), lerp(0.2, 0.85, f), lerp(0.22, 0.92, f));
    ledUniform.value.setComponent(b * 2, f);
    ledUniform.value.setComponent(b * 2 + 1, f);
    FX.light[b] = f;
    FX.air[b] = eff(k, 'air') / 100;
    const chOn = eff(k, 'chiller') > 0;
    FX.chill[b] = chOn ? (effField(k, 'chiller', 'set') - 20) * 0.6 : 1.4;
    waterPhase[b] += dt * 0.026 * (eff(k, 'pump') / 78 + 0.08);
