/* ---------- focus chart ---------- */
const RANGES = { live: { n: 181, dt: 0.5, micro: 1 }, '24h': { n: 289, dt: 300, micro: 0.6 }, '7d': { n: 337, dt: 1800, micro: 0.4 } };
const fCanvas = $('fCanvas'), fCtx = fCanvas.getContext('2d');
let fData = [], fHover = null;
function sizeFocus(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  fCanvas.width = Math.round((fCanvas.clientWidth || 440) * dpr);
  fCanvas.height = Math.round((fCanvas.clientHeight || 110) * dpr);
  fCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function rebuildFocus(){
  const R = RANGES[state.range], t = nowSec();
  fData = [];
  for (let i = R.n - 1; i >= 0; i--) fData.push({ t: t - i * R.dt, v: sampleScope(state.metric, t - i * R.dt, R.micro) });
  const ax = $('fAxis');
  if (state.range === 'live') ax.innerHTML = '<span>−90s</span><span>−60s</span><span>−30s</span><span>now</span>';
  else if (state.range === '24h') ax.innerHTML = [24, 18, 12, 6].map(k => `<span>${hhmm(t - k * 3600)}</span>`).join('') + '<span>now</span>';
  else ax.innerHTML = [7, 5, 3, 1].map(k => `<span>${new Date((t - k * 86400) * 1000).toLocaleDateString('en-US', { weekday: 'short' })}</span>`).join('') + '<span>now</span>';
}
function renderFocusHead(){
  const m = METRIC[state.metric];
  $('focus').style.setProperty('--c', m.color);
  $('fTitle').innerHTML = `${icon(M_ICON[m.id])}<span>${m.label}</span><em>${m.scope === 'bay' ? 'bay' : scopeName()}</em>`;
  $('fUnit').textContent = m.unit;
  const on = $('fRange').querySelector(`[data-r="${state.range}"]`);
  $('fRange').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === on));
  const ul = $('fRange').querySelector('.uline');
  ul.style.left = on.offsetLeft + 'px'; ul.style.width = on.offsetWidth + 'px';
  for (const id in vitRows) vitRows[id].el.classList.toggle('on', id === state.metric);
}
function updateFocusValue(){
  const m = METRIC[state.metric];
  const cur = sampleScope(state.metric, nowSec());
  $('fVal').textContent = fmt(state.metric, cur);
  const d = cur - fData[0].v, flat = Math.abs(d) < Math.pow(10, -m.dec) / 2;
  $('fDelta').innerHTML = `<svg viewBox="0 0 24 24" class="i" style="transform:rotate(${flat ? 90 : d > 0 ? 0 : 180}deg)">${ICON.arrow}</svg>${flat ? '0' : Math.abs(d).toFixed(m.dec)}`;
}
function drawFocus(){
  const w = fCanvas.clientWidth || 440, h = fCanvas.clientHeight || 110, ctx = fCtx, m = METRIC[state.metric];
  ctx.clearRect(0, 0, w, h);
  if (fData.length < 2) return;
  const padR = 32, padT = 8, padB = 6, cw = w - padR, ch = h - padT - padB;
  let mn = Infinity, mx = -Infinity;
  for (const p of fData){ mn = Math.min(mn, p.v); mx = Math.max(mx, p.v); }
  if (state.range !== 'live'){ mn = Math.min(mn, m.lo); mx = Math.max(mx, m.hi); }
  const ms = (m.hi - m.lo) * (state.range === 'live' ? 0.12 : 0.5);
  if (mx - mn < ms){ const c = (mx + mn) / 2; mn = c - ms / 2; mx = c + ms / 2; }
  const pv = (mx - mn) * 0.14; mn -= pv; mx += pv;
  const t0 = fData[0].t, t1 = fData[fData.length - 1].t;
  const X = t => ((t - t0) / (t1 - t0)) * cw, Y = v => padT + ch - ((v - mn) / (mx - mn)) * ch;

  // target band
  for (const v of [m.hi, m.lo]){
    const y = Math.round(Y(v)) + 0.5;
    if (y < padT || y > padT + ch) continue;
    const g = ctx.createLinearGradient(0, 0, cw, 0);
    g.addColorStop(0, 'rgba(87,255,192,0)'); g.addColorStop(0.3, 'rgba(87,255,192,.28)'); g.addColorStop(1, 'rgba(87,255,192,.28)');
    ctx.strokeStyle = g; ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke(); ctx.setLineDash([]);
  }
  // lights-off shading
  if (state.range !== 'live' && (state.metric === 'par' || state.metric === 'co2')){
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    let s = null;
    fData.forEach((p, i) => {
      const off = !lightsOn(hourOf(p.t));
      if (off && s === null) s = p.t;
      if ((!off || i === fData.length - 1) && s !== null){ ctx.fillRect(X(s), padT, X(p.t) - X(s), ch); s = null; }
    });
  }
  // y labels: only the target edges and the current value — no grid
  ctx.font = '500 9px ui-monospace, Menlo, monospace'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(190,225,214,.4)';
  for (const v of [m.hi, m.lo]){ const y = Y(v); if (y > padT + 4 && y < padT + ch - 4) ctx.fillText(String(v), cw + 8, y); }

  const pts = fData.map(p => [X(p.t), Y(p.v)]);
  const path = () => {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) ctx.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    ctx.lineTo(...pts[pts.length - 1]);
  };
  const fill = ctx.createLinearGradient(0, padT, 0, padT + ch);
  fill.addColorStop(0, m.color + '33'); fill.addColorStop(1, m.color + '00');
  ctx.beginPath(); path(); ctx.lineTo(pts[pts.length - 1][0], padT + ch); ctx.lineTo(0, padT + ch); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.save(); ctx.shadowColor = m.color; ctx.shadowBlur = 10;
  ctx.beginPath(); path(); ctx.strokeStyle = m.color; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
  // dosing marks on pH / EC
  if ((state.metric === 'ph' || state.metric === 'ec') && scope.bed != null){
    const d = ctl(`b${scope.bed}`, state.metric === 'ph' ? 'phc' : 'nutrients').doses;
    for (const ds of d){
      if (ds.t < t0 || ds.t > t1) continue;
      const x = X(ds.t);
      ctx.fillStyle = ds.auto ? 'rgba(87,255,192,.9)' : '#ffb35c';
      ctx.beginPath(); ctx.moveTo(x, padT + ch + 5); ctx.lineTo(x - 3.5, padT + ch + 11); ctx.lineTo(x + 3.5, padT + ch + 11); ctx.closePath(); ctx.fill();
    }
  }
  const [ex, ey] = pts[pts.length - 1];
  $('fNow').style.transform = `translate(${ex}px, ${ey}px)`;

  const tip = $('fTip');
  if (fHover !== null){
    const tx = t0 + clamp(fHover / cw, 0, 1) * (t1 - t0);
    let best = fData[0];
    for (const p of fData) if (Math.abs(p.t - tx) < Math.abs(best.t - tx)) best = p;
    const x = X(best.t), y = Y(best.v);
    const g = ctx.createLinearGradient(0, padT, 0, padT + ch);
    g.addColorStop(0, 'rgba(215,237,231,0)'); g.addColorStop(0.5, 'rgba(215,237,231,.3)'); g.addColorStop(1, 'rgba(215,237,231,0)');
    ctx.fillStyle = g; ctx.fillRect(Math.round(x), padT, 1, ch);
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fillStyle = m.color; ctx.fill();
    const d = new Date(best.t * 1000);
    const ts = state.range === 'live' ? d.toTimeString().slice(0, 8) : state.range === '24h' ? d.toTimeString().slice(0, 5) : d.toLocaleDateString('en-US', { weekday: 'short' }) + ' ' + d.toTimeString().slice(0, 5);
    tip.innerHTML = `<span>${ts}</span><b style="color:${m.color}">${fmt(state.metric, best.v)}</b>`;
    tip.style.opacity = 1;
    tip.style.transform = `translate(${clamp(x - tip.offsetWidth / 2, 0, w - tip.offsetWidth)}px, -24px)`;
  } else tip.style.opacity = 0;
}
fCanvas.addEventListener('pointermove', e => { fHover = e.clientX - fCanvas.getBoundingClientRect().left; drawFocus(); });
fCanvas.addEventListener('pointerleave', () => { fHover = null; drawFocus(); });

      const d = DISEASES[k];
      let enter = d.enter * R[k] * hours;
      if (k === 'tipburn') enter *= p.day > 18 ? 1 : 0.05;
      if (Math.random() < enter) born.push([p, k]);
    }
    for (const f of p.inf){
      const d = DISEASES[f.d];
      const favor = 0.25 + 0.75 * R[f.d];
      f.sev = clamp(f.sev + d.grow * favor * tr * hours - (p.treated > 0 && f.d !== 'tipburn' ? 0.004 * hours : 0), 0, 1);
      if (!d.spread || f.sev < 0.2) continue;
      const P = d.spread * (0.3 + R[f.d]) * f.sev * tr * hours;
      if (d.reach === 'bed'){
        // the shared solution carries zoospores to any head in the bed
        const bedPlants = SITES[e.bed].flat().filter(i => i >= 0);
        if (Math.random() < P * 8) born.push([PLANT[bedPlants[(Math.random() * bedPlants.length) | 0]], f.d]);
      } else {
        for (const n of siteNeighbors(p, d.reach)) if (Math.random() < P) born.push([n, f.d]);
      }
    }
    p.inf = p.inf.filter(f => f.sev > 0.004);
  }
  for (const [p, k] of born) infect(p, k);

}

const RAIL_SPEED = 25.7 / 40;                  // one bed length per 40 s

function inspect(p, rail, silent){
  if (p.reseed){ p.det = null; return; }
  let best = null;
  for (const f of p.inf){
    const d = DISEASES[f.d];
    const v = smoothstep(d.vis[0], d.vis[1], f.sev);
    if (v <= 0) continue;
    const conf = clamp(0.36 + 0.62 * v + (Math.random() - 0.5) * 0.1, 0, 0.99);
    if (conf > 0.5 && (!best || conf > best.conf)) best = { d: f.d, conf, sev: f.sev };
  }
  if (!best && !p.det && Math.random() < 0.0005) best = { d: Math.random() < 0.6 ? 'downy' : 'aphid', conf: 0.5 + Math.random() * 0.1, sev: 0, fp: true };
  const prev = p.det;
  if (best){
    const same = prev && prev.d === best.d;
    const conf = same ? prev.conf * 0.55 + best.conf * 0.45 : best.conf;
    p.det = { d: best.d, conf, sev: best.sev, fp: !!best.fp && (!same || prev.fp), t: nowSec(), first: same ? prev.first : nowSec(), cam: rail ? rail.name : 'CAM' };
    if (!silent){
      const D = DISEASES[best.d];
      if (!prev) logEvent(`${D.name} suspected · ${p.id} · ${(conf * 100).toFixed(0)}%`, 'auto', 'camera');
      else if (same && prev.conf < 0.75 && conf >= 0.75){
        logEvent(`${D.name} confirmed · ${p.id}`, 'man', D.icon);
        toast(`${D.name} confirmed on ${p.id}`, D.icon, true);

    }
  } else if (prev){
    prev.conf *= prev.fp ? 0.6 : 0.86;
    if (prev.conf < 0.46){

    }
  }

}

    const c = clamp(Math.round((r.x + 12.85) / (25.7 / 40)), 0, RAIL_COLS_MAX);

function blit(ctx, buf, w, h){
  const img = ctx.createImageData(w, h);

    const src = (h - 1 - y) * w * 4;
    img.data.set(buf.subarray(src, src + w * 4), y * w * 4);

  // sensor look: slight contrast curve + green-channel bias of a plant camera
  const d = img.data;
  for (let i = 0; i < d.length; i += 4){
    // soft shoulder so sunlit leaves don't clip, then a mild green bias
    const sh = v => 255 * (1 - Math.exp(-v / 255 * 1.35)) / (1 - Math.exp(-1.35));

}
const _proj2 = new THREE.Vector3();
function boxFor(cam, p, w, h){

    _proj2.set(e.x + dx, y + dy, e.z + dz).project(cam);
    return [(_proj2.x * 0.5 + 0.5) * w, (-_proj2.y * 0.5 + 0.5) * h, _proj2.z];

  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);

}

function respond(d){

    for (const p of hit){ p.treated = 1; siteNeighbors(p, 1).forEach(n => { n.treated = Math.max(n.treated, 0.6); }); }
  } else if (d === 'pythium'){
    for (const b of bedsWith('pythium')){ setManual(`b${b}`, 'air', { level: 100, on: true }); setManual(`b${b}`, 'chiller', { set: 18.5, on: true }); }

    setManual('gh', 'fans', { level: 80, on: true });
    for (const p of hit) p.treated = 1;

    for (const p of hit){ p.treated = 1; siteNeighbors(p, 2).forEach(n => { n.treated = Math.max(n.treated, 0.8); }); }
  }
  const D = DISEASES[d];
  logEvent(`${D.respond} · ${hit.length} heads`, 'man', d === 'aphid' ? 'bug' : 'spray');

async function linkOpen(){

    if (LINK.mode === 'ws'){
      if (location.protocol === 'https:' && LINK.url.startsWith('ws:')) throw new Error('This page is HTTPS, so the browser blocks ws://. Use the MQTT link, or open Vera over http on your LAN.');
      const sock = new WebSocket(LINK.url);
      LINK.sock = sock;
      sock.onopen = () => sock.send(JSON.stringify({ type: 'hello', client: 'vera-dashboard' }));
      sock.onmessage = ev => onLinkMessage(ev.data);

      sock.onclose = () => { if (LINK.sock === sock && LINK.state !== 'error'){ LINK.state = 'sim'; LIVE[0] = LIVE[1] = null; renderLink(); } };

function flyTo(nameOrView){
  const v = typeof nameOrView === 'string' ? VIEWS[nameOrView] : nameOrView;

/* =========================================================================
   28 — ANIMATION LOOP
   ========================================================================= */
const clock = new THREE.Clock();
let screenTimer = 0;
let firstFrame = true;
const tempScreenTime = { value: 0 };

/* adaptive quality: watch real frame times once the scene has settled and
   shed the most expensive extras on slower GPUs */
const perf = { acc: 0, n: 0, stage: 0, wait: 2.5 };
function adaptQuality(rawDt){
  if (QUERY.has('quality') || CAPTURE_MODE || document.hidden || perf.stage > 1) return;
  if (perf.wait > 0){ perf.wait -= rawDt; return; }
  if (rawDt > 0.25) return;            // a stall or a throttled background tab, not a real frame
  perf.acc += rawDt; perf.n++;
  if (perf.acc < 2.0) return;
  const ms = perf.acc / perf.n * 1000;
  perf.acc = 0; perf.n = 0; perf.wait = 1.0;
  if (perf.stage === 0){
    perf.stage = 1;
    if (ms > 21){ gtao.enabled = false; console.info('[quality] AO off at', ms.toFixed(1), 'ms'); }
    else perf.stage = 2;
  } else if (perf.stage === 1){
    perf.stage = 2;
    if (ms > 26){
      const pr = Math.max(1, PIXEL_RATIO * 0.75);
      renderer.setPixelRatio(pr); composer.setPixelRatio(pr);
      CURRENT_PR = pr;
      onResize();
      console.info('[quality] pixel ratio', pr.toFixed(2), 'at', ms.toFixed(1), 'ms');
    }
  }
}

function animate(){
  const rawDt = clock.getDelta();
  adaptQuality(rawDt);
  const dt = Math.min(rawDt, 0.06);
  const t = clock.elapsedTime;

  sharedWind.value = t;
  sharedWindy.value = 0.24;

  // camera tween
  if (camTween){
    const k = clamp((performance.now() - camTween.start) / camTween.dur, 0, 1);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    if (camTween.via){
      // quadratic Bézier: smooth tangent through the doorway
      const u = 1 - e;
      camera.position.copy(camTween.p0).multiplyScalar(u * u)
        .addScaledVector(camTween.via, 2 * u * e)
        .addScaledVector(camTween.p1, e * e);
    } else {
      camera.position.lerpVectors(camTween.p0, camTween.p1, e);
      camera.position.y += Math.sin(Math.PI * e) * camTween.lift;
    }
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    camera.lookAt(controls.target);
    if (k >= 1){
      camTween = null;
      controls.enabled = true;
      const damp = controls.enableDamping;
      controls.enableDamping = false;      // hand over without a damping kick
      controls.update();
      controls.enableDamping = damp;
    }
  }

  // water movement
  waterNormalBase.offset.x = (t * 0.022) % 1;
  waterNormalBase.offset.y = (t * 0.011) % 1;
  applyControls(dt, t);
  bedWaters.forEach((m, i) => {
    if (m.normalMap){
      m.normalMap.offset.x = (waterPhase[i] + i * 0.37) % 1;
      m.normalMap.offset.y = (waterPhase[i] * 0.46 - i * 0.21) % 1;
    }
  });

  // fans
  for (const f of fanSpinners){
    f.spinner.rotation.z += dt * f.speed * fanFactor;
  }
  // weather station
  weatherCups.rotation.y += dt * 5.4;
  // light breath + photoperiod
  ledMat.emissiveIntensity = 4.18 + Math.sin(t * 0.55) * 0.10;

  // particles
  updateParticles(dust, t, dt);
  updateParticles(pollen, t, dt);

  // HUD
  uiTick(dt, t);
  screenTimer += dt;
  if (screenTimer > 0.85){
    screenTimer = 0;
    drawControlScreen(t);
  }
  gradePass.uniforms.uTime.value = t;
  {
    const fd = camera.position.distanceTo(controls.target);
    const fu = focusPass.uniforms.uFocus;
    fu.value += (fd - fu.value) * Math.min(1, dt * 4);
  }

  if (controls.enabled) controls.update();
  composer.render();

  if (firstFrame){
    firstFrame = false;
    requestAnimationFrame(() => {
      document.getElementById('loader').classList.add('hidden');
      document.body.classList.add('ready');
    });
  }
}

  if (p){ const e = plantEntries[p.i]; setScope({ level: 'plant', bed: e.bed, row: e.row, plant: p.i }, { fly: false }); flyToPlant(p.i); camera.position.copy(camTween.p1); controls.target.copy(camTween.t1); camTween = null; controls.enabled = true; controls.update(); }
}
if (QUERY.has('metric') && METRIC[QUERY.get('metric')]) selectMetric(QUERY.get('metric'));
if (RANGES[QUERY.get('range')]) setRange(QUERY.get('range'));
if (QUERY.has('pop')){
  const b = document.querySelector(`#dock .ctl[data-id="${QUERY.get('pop')}"]`);
  if (b) openPop(QUERY.get('pop'), b);
}
if (CAPTURE_MODE && QUERY.has('hoverdemo')){
  // stills only: show the hover states that a screenshot cannot trigger
  const v = document.querySelector('.vt[data-m="ec"]'); v.classList.add('hv'); drawSpark('ec');
  document.querySelector('#dock .ctl[data-id="air"]')?.classList.add('hv');
  const pf = PLANT.find(p => p.issue), e = plantEntries[pf.i], cell = cellEls[pf.i].getBoundingClientRect();
  hoverSite(e.bed, e.row, e.col, cell.left + 4, cell.top + 4, 'map');
}
if (QUERY.has('mapmode') && MAP_MODES[QUERY.get('mapmode')]){ mapMode = QUERY.get('mapmode'); paintMap(); }
if (QUERY.has('nobloom')) bloom.enabled = false;
if (QUERY.has('noao')) gtao.enabled = false;
if (QUERY.has('nodof')) finalPass.uniforms.uDof.value = 0;
if (QUERY.has('nograde')) finalPass.uniforms.uGrade.value = 0;
if (QUERY.has('novignette')) document.getElementById('vignette').style.display = 'none';
if (QUERY.has('exposure')) renderer.toneMappingExposure = parseFloat(QUERY.get('exposure'));

renderer.compile(scene, camera);
renderer.setAnimationLoop(animate);
if (QUERY.has('nograss')) scene.traverse(o => { if (o.isInstancedMesh && o.material === grassMat) o.visible = false; });
if (QUERY.has('bench')){
  // perf harness: best-of-5 GPU-synchronised frame time, written to the title
  setTimeout(() => {
    renderer.setAnimationLoop(null);
    const gl = renderer.getContext(), px = new Uint8Array(4);
    const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const run = () => { let best = 1e9; for (let k = 0; k < 5; k++){ composer.render(); sync(); const t0 = performance.now(); for (let i = 0; i < 20; i++) composer.render(); sync(); best = Math.min(best, (performance.now() - t0) / 20); } return best.toFixed(1); };
    document.title = 'BENCH ' + run() + ' @' + renderer.domElement.width + 'x' + renderer.domElement.height;
  }, 6000);
}



window.__VH = {
  scene, camera, renderer, controls,
  flyTo,
  setAuto,
  setScope, selectMetric, setRange, state, scope, openPop, ctl, eff, PLANT, PE: plantEntries,
  composer, gtao, focusPass, bloom, animate,
  ready: true
};

</script>
</body>
</html>
